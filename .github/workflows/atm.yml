name: Compile and run C programs

on:
  push:
    branches: [main]
    paths:
      - ATM.C
      - calculator.c
      - "STUDENT DATABASE APPLICATION.C"
      - "STUDENT GRADE CALCULATOR.C"
      - .github/workflows/atm.yml

jobs:
  run-atm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile as C and run an ATM session
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -x c ATM.C -o atm
          output=$(printf '1234\n1\n2\n100\n3\n50\n4\n' | ./atm)
          printf '%s\n' "$output"
          grep -F 'Your Balance: Rs. 5000.00' <<< "$output"
          grep -F 'New Balance: Rs. 5100.00' <<< "$output"
          grep -F 'Remaining Balance: Rs. 5050.00' <<< "$output"
      - name: Compile and run calculator.c
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -x c calculator.c -o calculator
          output=$(printf '5 + 3\n' | ./calculator)
          printf '%s\n' "$output"
          grep -F '= 8.00' <<< "$output"
          output=$(printf '5 / 0\n' | ./calculator)
          printf '%s\n' "$output"
          grep -F 'Division by zero!' <<< "$output"
      - name: Compile and run student database application
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -x c "STUDENT DATABASE APPLICATION.C" -o student-database
          output=$(printf '1\n101\nAsha\n95.5\nDelhi\nEngineer\n' | ./student-database)
          printf '%s\n' "$output"
          grep -F 'Student roll number: 101' <<< "$output"
          grep -F 'Name of student: Asha' <<< "$output"
          grep -F 'Cutoff of student: 95.50' <<< "$output"
          grep -F 'City of student: Delhi' <<< "$output"
          grep -F 'Dream of student: Engineer' <<< "$output"
      - name: Compile and run student grade calculator
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -x c "STUDENT GRADE CALCULATOR.C" -o student-grade
          output=$(./student-grade Asha 90 80 70 60 50)
          printf '%s\n' "$output"
          grep -F 'Student Name : Asha' <<< "$output"
          grep -F 'Total        : 350' <<< "$output"
          grep -F 'Average      : 70.00' <<< "$output"
          grep -F 'Result       : PASS' <<< "$output"
          grep -F 'Grade        : B' <<< "$output"
